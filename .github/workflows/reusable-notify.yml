# =============================================================================
# Reusable: Notify (Slack + Jira + Azure DevOps + GitHub Issue)
# =============================================================================
# Dispatches alerts for high/critical findings. Each integration is best-effort and
# self-skips when its secrets are not configured (production repos only for Jira/ADO).
# =============================================================================
name: reusable-notify

on:
  workflow_call:
    inputs:
      production:
        description: "Production repo -> create Jira + ADO tickets"
        type: boolean
        required: false
        default: false
      min-severity:
        description: "Lowest severity to alert on"
        type: string
        required: false
        default: high
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_USER:
        required: false
      JIRA_TOKEN:
        required: false
      JIRA_PROJECT:
        required: false
      ADO_ORG_URL:
        required: false
      ADO_PROJECT:
        required: false
      ADO_PAT:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  notify:
    name: Dispatch alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          name: findings
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/notify_slack.py \
            --findings findings.json \
            --repo "${{ github.repository }}" \
            --context pr \
            --min-severity "${{ inputs.min-severity }}" || true

      - name: Jira tickets (production only)
        if: ${{ inputs.production }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
        run: |
          python scripts/create_jira_ticket.py \
            --findings findings.json \
            --repo "${{ github.repository }}" \
            --min-severity "${{ inputs.min-severity }}" || true

      - name: Azure DevOps work items (production only)
        if: ${{ inputs.production }}
        env:
          ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          python scripts/create_ado_workitem.py \
            --findings findings.json \
            --repo "${{ github.repository }}" \
            --min-severity "${{ inputs.min-severity }}" || true

      - name: GitHub Issue for high/critical
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try { findings = JSON.parse(fs.readFileSync('findings.json', 'utf8')); } catch (e) {}
            const rank = { critical: 0, high: 1, medium: 2, low: 3 };
            const cutoff = rank['${{ inputs.min-severity }}'] ?? 1;
            const top = findings.filter(f => (rank[f.severity] ?? 3) <= cutoff);
            if (top.length === 0) { core.info('No high/critical findings; no issue created.'); return; }
            const body = [
              `## Security findings (${top.length})`,
              '',
              ...top.slice(0, 30).map(f =>
                `- **${f.severity}** \`${f.path}:${f.line}\` (${f.cwe}) — ${(f.message||'').slice(0,160)}`),
              '',
              `_Generated by claude-security-agent for ${context.sha.slice(0,7)}._`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SECURITY] ${top.length} high/critical finding(s) on ${context.sha.slice(0,7)}`,
              body,
              labels: ['security', 'vulnerability', 'high-priority'],
            });
