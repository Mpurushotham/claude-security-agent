# =============================================================================
# Reusable: Secret scanning (TruffleHog + gitleaks)
# =============================================================================
# Complements GitHub Advanced Security push protection. Fails the job when a verified
# secret is detected. Full history is fetched so historical leaks are caught.
# =============================================================================
name: reusable-secret-scan

on:
  workflow_call:
    inputs:
      fail-on-detection:
        description: "Fail the job when a secret is found"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (verified secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        if: ${{ inputs.fail-on-detection }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # GITLEAKS_LICENSE only needed for org accounts; optional for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
