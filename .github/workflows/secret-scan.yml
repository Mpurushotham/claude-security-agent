# =============================================================================
# Caller: Secret scan (this repo scans itself as a backstop to push protection)
# =============================================================================
name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/reusable/secret-scan.yml
    with:
      fail-on-detection: true
    secrets: inherit
